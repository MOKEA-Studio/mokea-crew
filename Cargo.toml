[workspace]
resolver = "2"
members = [
    "crates/mokea-cli",
    "crates/mokea-core",
    "crates/mokea-agents",
    "crates/mokea-workspace",
    "crates/mokea-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
futures = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "io-util"] }
toml = "0.8"
